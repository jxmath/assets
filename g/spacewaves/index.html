<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Waves | Jaxsons math</title>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #unity-canvas { position:fixed; top:0; left:0; width:100%; height:100%; outline:none; background:#000; }
    #loading-text {
      position:fixed; left:50%; top:40%; transform:translate(-50%,-50%);
      color:#fff; font:28px cursive; text-align:center; z-index:10;
    }
  </style>
  <script>
    window.unityStringify = function (v) {
      try { return typeof v === "string" ? v : JSON.stringify(v); } catch (e) { return ""; }
    };
    window.UnitySDK = {
      logError: function () {},
      lockPointer: function () {},
      unlockPointer: function () {}
    };
  </script>
  <script src="cg-sdk.js"></script>
</head>
<body>
  <div id="loading-text">LOADING...</div>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <script>
    var canvas = document.getElementById("unity-canvas");
    var loadingText = document.getElementById("loading-text");
    var unityReady = false;

    function fit() {
      var w = Math.max(2, window.innerWidth || 960);
      var h = Math.max(2, window.innerHeight || 600);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      if (!unityReady) {
        canvas.width = w;
        canvas.height = h;
      }
    }
    fit();
    window.addEventListener("resize", fit);

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/e4aa851098e3e5d328e4d879078ad6c5.data",
      frameworkUrl: buildUrl + "/f3dc87e8bc321dd382fbd3fa53e1091f.framework.js",
      codeUrl: buildUrl + "/9adf8a1aafea4c2333e26d66a8b36d56.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Space Waves",
      productName: "Space Waves",
      productVersion: "1.0.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: 1
    };

    var script = document.createElement("script");
    script.src = buildUrl + "/81bbae32c7a77bc49304934b19e72883.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        loadingText.textContent = "LOADING... " + Math.floor(p * 100) + "%";
      }).then(function (instance) {
        window.gameInstance = instance;
        window.unityInstance = instance;
        window.unityGameInstance = instance;
        unityReady = true;
        loadingText.style.display = "none";
        fit();
      }).catch(function (msg) {
        loadingText.textContent = String(msg);
        alert(msg);
      });
    };
    script.onerror = function () {
      loadingText.textContent = "Failed to load loader";
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
