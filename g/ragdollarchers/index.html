<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ragdoll Archers | Jaxsons math</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#000; }
    #unity-container { position:fixed; inset:0; width:100%; height:100%; }
    #unity-canvas { width:100%; height:100%; display:block; background:#231F20; }
  </style>
  <script>
    (function () {
      function noop() {}
      function resolved() { return Promise.resolve(); }
      window.CrazyGames = {
        SDK: {
          addInitCallback: function (cb) { try { cb({}); } catch (e) {} },
          init: resolved,
          game: {
            gameplayStart: noop,
            gameplayStop: noop,
            happytime: noop,
            loadingStart: noop,
            loadingStop: noop
          },
          ad: {
            requestAd: function () { return Promise.resolve(); },
            hasAdblock: function () { return Promise.resolve(false); }
          },
          banner: { requestBanner: resolved, clearBanner: noop },
          user: {
            getUser: function () { return Promise.resolve(null); },
            getUserToken: function () { return Promise.resolve(""); },
            addScore: noop,
            showAuthPrompt: resolved,
            showAccountLinkPrompt: resolved
          },
          data: {
            clear: resolved,
            getItem: function () { return Promise.resolve(null); },
            setItem: resolved,
            removeItem: resolved
          }
        }
      };
      var callbacks = [];
      window.UnitySDK = {
        objectName: "CrazySDK",
        onSdkScriptLoaded: function () {
          callbacks.forEach(function (c) { try { c(); } catch (e) {} });
          callbacks = [];
        },
        ensureLoaded: function (cb) {
          if (typeof cb === "function") {
            try { cb(); } catch (e) {}
          }
        }
      };
      window.unityStringify = function (v) {
        try { return typeof v === "string" ? v : JSON.stringify(v); } catch (e) { return ""; }
      };
    })();
  </script>
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
  </div>
  <div id="loading-cover">
    <div id="unity-loading-bar">
      <div id="unity-logo"><img src="logo.jpeg" alt=""></div>
      <div class="progress-spinner-container">
        <div class="spinner-left"><img src="spinner.png" alt=""></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner-right"><img src="spinner.png" alt=""></div>
      </div>
    </div>
  </div>
  <script>
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/6697b6deba8b617c67b69c55dcd07cb1.data.unityweb",
      frameworkUrl: buildUrl + "/0be3c3ee7115b26e1ae28e643afdf1f2.js.unityweb",
      codeUrl: buildUrl + "/b3397c29f6878557c1c614cbf9e196ea.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Ericetto",
      productName: "Ragdoll Archers",
      productVersion: "0.1"
    };

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingCover = document.querySelector("#loading-cover");
    var progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }

    function fit() {
      var w = window.innerWidth || 960;
      var h = window.innerHeight || 600;
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
    }
    fit();
    window.addEventListener("resize", fit);

    var unityLoader = document.createElement("script");
    unityLoader.src = buildUrl + "/v111.loader.js";
    unityLoader.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        if (progressBarEmpty) progressBarEmpty.style.display = "";
        if (progressBarFull) progressBarFull.style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance;
        if (loadingCover) loadingCover.style.display = "none";
        fit();
      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(unityLoader);

    document.addEventListener("pointerdown", function () {
      container.focus();
      window.focus();
      canvas.focus();
    });
  </script>
</body>
</html>
