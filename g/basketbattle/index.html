<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>Basket Battle</title>
  <link rel="stylesheet" href="TemplateData/style.css">
  <script src="ytgame.js"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #231F20;
    }
    #unity-container {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      transform: none;
    }
    #unity-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      background: #231F20;
    }
  </style>
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <script>
    if (typeof ytgame === "undefined") {
      throw new Error("ytgame failed to load");
    }

    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      console.log(type || "info", msg);
      if (type === "error") {
        warningBanner.style.display = "block";
        warningBanner.textContent = msg;
      }
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/BasketBattleWeb.loader.js";
    var config = {
      dataUrl: buildUrl + "/BasketBattleWeb.data",
      frameworkUrl: buildUrl + "/BasketBattleWeb.framework.js",
      codeUrl: buildUrl + "/BasketBattleWeb.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Noor Creative, LLC",
      productName: "Basket Battle",
      productVersion: "3.4",
      showBanner: unityShowBanner
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.getElementsByTagName("head")[0].appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
    }

    loadingBar.style.display = "block";

    var unityGameInstance = null;
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = Math.floor(100 * progress) + "%";
      }).then(function (unityInstance) {
        unityGameInstance = unityInstance;
        loadingBar.style.display = "none";
        try {
          if (window.ytgame && ytgame.game) {
            if (ytgame.game.firstFrameReady) ytgame.game.firstFrameReady();
            if (ytgame.game.gameReady) ytgame.game.gameReady();
          }
        } catch (e) {}
      }).catch(function (message) {
        console.error(message);
        unityShowBanner(String(message), "error");
      });
    };
    script.onerror = function () {
      unityShowBanner("Failed to load Unity loader", "error");
    };
    document.body.appendChild(script);

    window.onfocus = function () {
      if (unityGameInstance) {
        try { unityGameInstance.SendMessage("IDFAPreload", "BrowserVisible"); } catch (e) {}
      }
    };
    window.onblur = function () {
      if (unityGameInstance) {
        try { unityGameInstance.SendMessage("IDFAPreload", "BrowserHide"); } catch (e) {}
      }
    };
  </script>
</body>
</html>
