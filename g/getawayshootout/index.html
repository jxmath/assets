<html lang="en-us">
  <head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7FN7LEVWXD"></script>

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Getaway Shootout | Jaxsons Math</title>
    <script src="Build/UnityLoader.js"></script>
    <script src="/js/main.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #gameContainer {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #gameContainer canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      :fullscreen,
      :-webkit-full-screen {
        width: 100% !important;
        height: 100% !important;
        background: #000;
      }
      :fullscreen canvas,
      :-webkit-full-screen canvas {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="gameContainer" style="width: 100%; height: 100%; margin: auto;"></div>
    <script>
      var gameInstance = UnityLoader.instantiate(
        "gameContainer",
        "GetawayShootout.json",
        { width: 800, height: 600 }
      );

      function stretchCanvas() {
        var canvas = document.querySelector("#gameContainer canvas");
        if (!canvas) return;
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      window.addEventListener("resize", stretchCanvas);
      document.addEventListener("fullscreenchange", stretchCanvas);
      document.addEventListener("webkitfullscreenchange", stretchCanvas);

      var n = 0;
      var t = setInterval(function () {
        stretchCanvas();
        n++;
        if (n > 50) clearInterval(t);
      }, 100);
    </script>
  </body>
</html>
