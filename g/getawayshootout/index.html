<html lang="en-us">
  <head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7FN7LEVWXD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-7FN7LEVWXD');
    </script>
    <link rel="icon" type="image/x-icon" href="img/images.jpg" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Getaway Shootout | Jaxsons Math</title>
    <script src="Build/UnityLoader.js"></script>
    <script src="/js/main.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #gameContainer {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #gameContainer canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      :-webkit-full-screen,
      :fullscreen {
        width: 100% !important;
        height: 100% !important;
      }
      :-webkit-full-screen canvas,
      :fullscreen canvas {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <div id="gameContainer"></div>
    <script>
      function fitGame() {
        var container = document.getElementById("gameContainer");
        var canvas = document.querySelector("#gameContainer canvas");
        var w = window.innerWidth;
        var h = window.innerHeight;

        if (document.fullscreenElement || document.webkitFullscreenElement) {
          var fs = document.fullscreenElement || document.webkitFullscreenElement;
          w = fs.clientWidth || w;
          h = fs.clientHeight || h;
        }

        if (container) {
          container.style.width = w + "px";
          container.style.height = h + "px";
        }
        if (canvas) {
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          canvas.width = w;
          canvas.height = h;
        }
        if (typeof gameInstance !== "undefined" && gameInstance.Module && gameInstance.Module.setCanvasSize) {
          gameInstance.Module.setCanvasSize(w, h);
        }
      }

      var gameInstance = UnityLoader.instantiate(
        "gameContainer",
        "GetawayShootout.json",
        { width: window.innerWidth, height: window.innerHeight, onProgress: UnityProgress }
      );

      window.addEventListener("resize", fitGame);
      document.addEventListener("fullscreenchange", function () {
        setTimeout(fitGame, 50);
        setTimeout(fitGame, 200);
      });
      document.addEventListener("webkitfullscreenchange", function () {
        setTimeout(fitGame, 50);
        setTimeout(fitGame, 200);
      });

      var fitTries = 0;
      var fitTimer = setInterval(function () {
        fitGame();
        fitTries++;
        if (fitTries > 40 || document.querySelector("#gameContainer canvas")) {
          if (fitTries > 40) clearInterval(fitTimer);
        }
      }, 100);

      window.addEventListener("load", fitGame);
    </script>
  </body>
</html>
