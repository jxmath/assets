<html lang="en-us">
  <head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7FN7LEVWXD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());
      gtag("config", "G-7FN7LEVWXD");

    <link rel="icon" type="image/x-icon" href="img/images.jpg" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Getaway Shootout | Jaxsons Math</title>
    <script src="Build/UnityLoader.js"></script>
    <script src="/js/main.js"></script>
    <style>
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
        background: #000 !important;
      }
      #gameContainer {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      #gameContainer,
      #gameContainer div,
      #gameContainer canvas {
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        box-sizing: border-box !important;
      }
      #gameContainer canvas {
        display: block !important;
        object-fit: fill !important;
      }
      :fullscreen,
      :-webkit-full-screen {
        width: 100% !important;
        height: 100% !important;
        background: #000 !important;
      }
      :fullscreen div,
      :fullscreen canvas,
      :-webkit-full-screen div,
      :-webkit-full-screen canvas {
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
      }
    </style>
  </head>
  <body>
    <div id="gameContainer"></div>
    <script>
      var gameInstance = UnityLoader.instantiate(
        "gameContainer",
        "GetawayShootout.json",
        { width: 800, height: 600 }
      );

      function forceFill() {
        var root = document.getElementById("gameContainer");
        if (!root) return;
        root.style.cssText =
          "position:fixed;left:0;top:0;right:0;bottom:0;width:100%;height:100%;margin:0;padding:0;";
        var nodes = root.querySelectorAll("div, canvas");
        for (var i = 0; i < nodes.length; i++) {
          nodes[i].style.setProperty("width", "100%", "important");
          nodes[i].style.setProperty("height", "100%", "important");
          nodes[i].style.setProperty("max-width", "none", "important");
          nodes[i].style.setProperty("max-height", "none", "important");
          nodes[i].style.setProperty("margin", "0", "important");
          nodes[i].style.setProperty("padding", "0", "important");
        }
      }

      window.addEventListener("resize", forceFill);
      document.addEventListener("fullscreenchange", forceFill);
      document.addEventListener("webkitfullscreenchange", forceFill);

      var n = 0;
      var t = setInterval(function () {
        forceFill();
        n++;
        if (n > 100) clearInterval(t);
      }, 50);
    </script>
  </body>
</html>
